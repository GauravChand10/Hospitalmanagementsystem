{% extends "base.html" %}

{% block title %}
Patient Login
{% endblock %}

{% block content %}

<div class="container">
    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">

        <h2 class="mb-4">Patient Login</h2>
        <p class="mt-3">
    Don't have an account?
    <a href="{% url 'register' %}">Register here</a>
</p>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Login
            </button>

        </form>

    </div>
</div>

{% endblock %}
