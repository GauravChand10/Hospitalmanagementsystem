{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width: 720px">
    <h1 class="h3">{{ title }}</h1>
    {% if help_text %}<p>{{ help_text }}</p>{% endif %}
    {% if not blocked %}<form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-outline-secondary" href="{% url 'appointment_list' %}">Back to appointments</a>
    </form>{% endif %}
</div>
{% endblock %}
