{% extends "base.html" %}

{% block title %}
Delete Doctor
{% endblock %}

{% block content %}

<div class="card shadow p-4">

    <h2>Delete Doctor</h2>

    <p class="mt-3">
        Are you sure you want to delete
        <strong>Dr. {{ doctor.first_name }} {{ doctor.last_name }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Yes, Delete
        </button>

        <a href="{% url 'doctor_detail' doctor.id %}"
           class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
